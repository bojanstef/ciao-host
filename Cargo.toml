[workspace]
members = ["crates/ciao-host"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.5.53", features = ["derive"] }
iroh = "=1.0.2"
# Pinned with iroh: `RelayQuicConfig` is the one relay type iroh does not re-export, and a
# skew between the two would be a wire-level mismatch rather than a compile error.
iroh-relay = "=1.0.2"
iroh-tickets = "=1.0.0"
nix = { version = "0.31.1", features = [
    "fs",
    "process",
    "signal",
    "socket",
    "term",
    "user",
] }
parking_lot = "0.12.5"
portable-pty = "=0.9.0"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
x25519-dalek = "2.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# iroh 1.0.2 plus per-path close/idle controls; see vendor/iroh/CIAO-PATCH.md.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
# noq-proto 1.0.1 (the version iroh 1.0.2 uses) plus PathStats::pto_count; see vendor/noq-proto/CIAO-PATCH.md.
noq-proto = { path = "vendor/noq-proto" }
