# Dependabot version updates for the crates and for the actions ci.yml uses. Free on GitHub Free
# for public and private repositories (github.com/pricing, Free: "Dependabot security and version
# updates"). The agent vendors are watched elsewhere; this file covers what they do not.
#
# Every pull request here is a hand merge, and nothing ships until the next host release. A crate
# bump also changes THIRD-PARTY-NOTICES.md, which ci.yml checks (`python3 scripts/host_notices.py
# --check`): regenerate it on the pull request's branch before merging.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # Compatible bumps ride together in one pull request; a major arrives on its own.
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # `portable-pty = "=0.9.0"` is exact by Spec 002 §2.3: the reviewed release, kept behind a
        # Ciao-owned PTY boundary, and a change owes a review of macOS behaviour, process cleanup
        # and licenses. Not ignored (nothing else watches it), but never merged inside a lump: it
        # gets its own pull request.
        exclude-patterns: ["portable-pty"]
    ignore:
      # `iroh = "=1.0.2"` is the pin behind `[patch.crates-io]`: vendor/iroh is that release plus
      # one narrow patch, and vendor/noq-proto is the noq-proto 1.0.1 it resolves to, plus one.
      # Bumping iroh means re-applying or dropping both patches deliberately (ADR 001, amendment
      # 2026-09-02; each CIAO-PATCH.md says when to delete it). iroh-relay is pinned with iroh
      # because a skew is a wire-level mismatch (see Cargo.toml), and iroh-tickets has been pinned
      # with it since Spec 002. noq-proto is transitive, so listing it is belt and braces.
      - dependency-name: "iroh"
      - dependency-name: "iroh-relay"
      - dependency-name: "iroh-tickets"
      - dependency-name: "noq-proto"
  - package-ecosystem: "github-actions"
    # "/" is where Dependabot looks for .github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
