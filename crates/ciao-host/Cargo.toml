[package]
name = "ciao-host"
version = "0.1.67"
description = "Ciao host CLI and daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ciao"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
crypto_secretbox = "0.1.1"
futures-util = "0.3"
hkdf = "0.12"
iroh.workspace = true
iroh-relay.workspace = true
iroh-tickets.workspace = true
nix.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
qrcode.workspace = true
rand.workspace = true
salsa20 = "0.10.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.28.0"
tracing.workspace = true
tracing-subscriber.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ciao-native-process = { path = "../ciao-native-process" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "event"] }

[dev-dependencies]
iroh = { workspace = true, features = ["unstable-net-report"] }
tempfile = "3.23.0"

[lints]
workspace = true
